name: DSH Agent Test

# 用 DeepSeek Harness (dsh) 当测试台:同一个 agent 任务,换不同免费模型当后端,
# 看谁真能在 agent 循环里把活干完(工具调用/多步任务),而不只是吐字快。
# 跑在 GitHub Actions 一次性容器里 —— 符合 dsh SAFETY.md 的"用一次性环境"要求。

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "OpenAI 兼容端点(如 https://integrate.api.nvidia.com/v1)"
        required: true
        default: "https://integrate.api.nvidia.com/v1"
      model:
        description: "模型 id(如 deepseek-ai/deepseek-v4-flash-0731)"
        required: true
        default: "deepseek-ai/deepseek-v4-flash-0731"
      key_name:
        description: "用哪个 secret 当 key:NVIDIA / GROQ / OPENROUTER"
        required: true
        default: "NVIDIA"
      difficulty:
        description: "任务类型:easy=数文件 / hard=修bug / organize=整理文件 / summarize=读多文件写汇总"
        required: true
        default: "hard"
        type: choice
        options:
          - easy
          - hard
          - organize
          - summarize

jobs:
  agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone dsh + install SDK
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git dsh
          cd dsh
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet deepseek-harness-sdk
          echo "SDK installed"

      - name: Prepare disposable workspace
        run: |
          mkdir -p /tmp/ws /tmp/dsh-home
          # easy 任务:数 .md 文件(正确答案 = 3)
          printf 'alpha\n' > /tmp/ws/a.md
          printf 'beta\n'  > /tmp/ws/b.md
          printf 'gamma\n' > /tmp/ws/c.md
          printf 'not markdown\n' > /tmp/ws/d.txt
          # hard 任务:一个跑起来会崩的脚本,agent 必须真读 traceback 才能修对。
          # 埋了两个 bug:变量名拼错(tota/total),以及空列表除零。
          cat > /tmp/ws/stats.py <<'PYFILE'
          def average_of_positives(nums):
              positives = [n for n in nums if n > 0]
              tota = sum(positives)
              return total / len(positives)


          if __name__ == "__main__":
              print("avg:", average_of_positives([1, 2, 3, 4]))
              print("avg empty:", average_of_positives([-1, -2]))
          PYFILE
          # heredoc 缩进会带进文件,去掉行首 10 个空格
          sed -i 's/^          //' /tmp/ws/stats.py
          echo "--- stats.py (should crash) ---"; cat /tmp/ws/stats.py
          python /tmp/ws/stats.py 2>&1 | tail -3 || true
          # organize 任务用:一堆混杂文件,要按类型分目录
          mkdir -p /tmp/ws/inbox
          for f in report_q1.csv report_q2.csv photo1.jpg photo2.jpg notes.txt draft.txt budget.csv logo.png; do
            echo "dummy content of $f" > "/tmp/ws/inbox/$f"
          done
          # summarize 任务用:三份结构相同的销售记录,要读全并汇总
          mkdir -p /tmp/ws/sales
          printf 'region,units\nnorth,120\nsouth,80\n'  > /tmp/ws/sales/jan.csv
          printf 'region,units\nnorth,200\nsouth,150\n' > /tmp/ws/sales/feb.csv
          printf 'region,units\nnorth,90\nsouth,60\n'   > /tmp/ws/sales/mar.csv
          ls -la /tmp/ws /tmp/ws/inbox /tmp/ws/sales

      - name: Run agent task
        id: run
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd dsh
          KEY_VAR="${{ github.event.inputs.key_name }}_API_KEY"
          export DEEPSEEK_API_KEY="${!KEY_VAR}"
          export DEEPSEEK_BASE_URL="${{ github.event.inputs.base_url }}"
          export DSH_MODEL="${{ github.event.inputs.model }}"
          echo "backend: $DEEPSEEK_BASE_URL  model: $DSH_MODEL"
          echo "=== 已装 SDK 的真实签名(pip 版可能比仓库示例旧)==="
          python -c "import inspect;from deepseek_harness import DeepSeekHarness as H;print('DeepSeekHarness:',inspect.signature(H.__init__))" 2>&1 | tee /tmp/sig.txt || true
          case "${{ github.event.inputs.difficulty }}" in
            easy)
              TASK="Create a file called result.txt containing the number of .md files in the workspace, then read it back and tell me the number." ;;
            hard)
              TASK="The script stats.py in this directory crashes when you run it. Run it, read the error, fix the bugs in stats.py, and run it again until it completes successfully and prints both averages. Handle the empty-list case sensibly instead of crashing." ;;
            organize)
              TASK="The inbox/ directory has mixed files. Sort every file in inbox/ into subfolders by type: put .csv files in inbox/data/, image files (.jpg, .png) in inbox/images/, and .txt files in inbox/text/. Move them, do not copy. Then list what ended up in each folder." ;;
            summarize)
              TASK="The sales/ directory has three monthly CSV files with region and units columns. Read all three, add up the total units for each region across all months, and write a file called sales/summary.txt containing one line per region in the format 'region: total'. Then tell me which region sold more." ;;
          esac
          echo "TASK: $TASK"
          START=$(date +%s)
          set +e
          timeout 900 python $GITHUB_WORKSPACE/automation/run_dsh_agent.py "$TASK" 2>&1 | tee /tmp/agent-out.txt
          RC=$?
          set -e
          END=$(date +%s)
          echo "---- elapsed: $((END-START))s, exit: $RC ----"

      - name: Inspect result and session log
        if: always()
        run: |
          if [ "${{ github.event.inputs.difficulty }}" = "organize" ]; then
            echo "=== organize:文件应被移动到对应子目录 ==="
            find /tmp/ws/inbox -type f | sort
            D=$(ls /tmp/ws/inbox/data/*.csv 2>/dev/null | wc -l)
            I=$(ls /tmp/ws/inbox/images/*.jpg /tmp/ws/inbox/images/*.png 2>/dev/null | wc -l)
            T=$(ls /tmp/ws/inbox/text/*.txt 2>/dev/null | wc -l)
            LEFT=$(ls /tmp/ws/inbox/*.* 2>/dev/null | wc -l)
            echo "data=$D(应3) images=$I(应3) text=$T(应2) 根目录残留=$LEFT(应0)"
            if [ "$D" = "3" ] && [ "$I" = "3" ] && [ "$T" = "2" ] && [ "$LEFT" = "0" ]; then
              echo "VERDICT: PASS (all files sorted correctly)"
            elif [ "$D" -gt 0 ] || [ "$I" -gt 0 ] || [ "$T" -gt 0 ]; then
              echo "VERDICT: PARTIAL (moved some, not all correct)"
            else
              echo "VERDICT: FAIL (nothing sorted)"
            fi
          elif [ "${{ github.event.inputs.difficulty }}" = "summarize" ]; then
            echo "=== summarize:summary.txt 应含 north:410 south:290 ==="
            if [ -f /tmp/ws/sales/summary.txt ]; then
              cat /tmp/ws/sales/summary.txt
              if grep -qi "410" /tmp/ws/sales/summary.txt && grep -qi "290" /tmp/ws/sales/summary.txt; then
                echo "VERDICT: PASS (both totals correct)"
              else
                echo "VERDICT: PARTIAL (file written but numbers wrong)"
              fi
            else
              echo "VERDICT: FAIL (no summary.txt)"
            fi
          elif [ "${{ github.event.inputs.difficulty }}" = "easy" ]; then
            echo "=== easy:result.txt 应存在且含 3 ==="
            if [ -f /tmp/ws/result.txt ]; then
              echo "result.txt EXISTS:"; cat /tmp/ws/result.txt
              grep -q "3" /tmp/ws/result.txt && echo "VERDICT: PASS (correct count)" || echo "VERDICT: FAIL (wrong number)"
            else
              echo "result.txt MISSING"; echo "VERDICT: FAIL (agent did not create the file)"
            fi
          else
            echo "=== hard:stats.py 应能跑通且两行都输出 ==="
            echo "--- 修改后的 stats.py ---"; cat /tmp/ws/stats.py
            echo "--- 实际运行 ---"
            OUT=$(python /tmp/ws/stats.py 2>&1); RC2=$?
            echo "$OUT"
            if [ $RC2 -ne 0 ]; then
              echo "VERDICT: FAIL (still crashes)"
            elif echo "$OUT" | grep -q "avg: 2.5" && echo "$OUT" | grep -q "avg empty:"; then
              echo "VERDICT: PASS (fixed both bugs, correct average, handles empty list)"
            else
              echo "VERDICT: PARTIAL (runs, but output not as expected)"
            fi
          fi
          echo "=== 会话日志统计(工具调用次数)==="
          find /tmp/dsh-home/sessions -name "*.jsonl" 2>/dev/null | head -3 | while read f; do
            echo "-- $f: $(wc -l < "$f") 行"
            grep -o '"tool[^"]*"' "$f" 2>/dev/null | sort | uniq -c | sort -rn | head -8
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-session-${{ github.event.inputs.key_name }}
          path: |
            /tmp/agent-out.txt
            /tmp/dsh-home/sessions
          if-no-files-found: warn
